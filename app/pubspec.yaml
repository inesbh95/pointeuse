name: pointeuse
description: Pointage des employés en mission avec reconnaissance faciale et contrôles de localisation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.12.1
  geolocator: ^13.0.1
  image: ^4.2.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_timezone: ^5.1.1
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  excel: ^4.0.6
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_file_dialog: ^3.3.6
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  geocoding: 5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
